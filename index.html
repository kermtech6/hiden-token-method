<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hidden Token Method - Status</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #0d1117;
      color: #e6edf3;
    }
    .card {
      text-align: center;
      padding: 2rem 3rem;
      border-radius: 12px;
      background: #161b22;
      border: 1px solid #30363d;
    }
    .status {
      font-size: 1.5rem;
      font-weight: 600;
      margin-top: 1rem;
    }
    .ok { color: #3fb950; }
    .ko { color: #f85149; }
    .loading { color: #8b949e; }
  </style>
</head>
<body>
  <div class="card">
    <h1>GITHUB_TOKEN</h1>
    <div id="result" class="status loading">Vérification...</div>
  </div>

  <script>
    fetch('/api/status')
      .then(r => r.json())
      .then(data => {
        const el = document.getElementById('result');
        if (data.configured) {
          el.textContent = '✅ Token configuré';
          el.className = 'status ok';
        } else {
          el.textContent = '❌ Token non configuré';
          el.className = 'status ko';
        }
      })
      .catch(() => {
        const el = document.getElementById('result');
        el.textContent = '⚠️ Erreur de connexion à l\'API';
        el.className = 'status ko';
      });
  </script>
</body>
</html>
